<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Architecture of spark-crossover"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs><rect width="960" height="500" fill="#ffffff"/><text x="480.0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#1b1f23">Four engines, one file, and a gate before any timing is read</text><rect x="24" y="150" width="180" height="70" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="114.0" y="170" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">one Parquet file</text><text x="114.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">written once,</text><text x="114.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">read by all four</text><rect x="290" y="68" width="190" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="385.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">pandas</text><text x="385.0" y="106" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">own process</text><line x1="204" y1="185" x2="290" y2="91" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="130" width="190" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="385.0" y="150" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">polars</text><text x="385.0" y="168" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">own process</text><line x1="204" y1="185" x2="290" y2="153" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="192" width="190" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="385.0" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">duckdb</text><text x="385.0" y="230" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">own process</text><line x1="204" y1="185" x2="290" y2="215" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="290" y="254" width="190" height="46" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="385.0" y="274" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">spark</text><text x="385.0" y="292" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">own process</text><line x1="204" y1="185" x2="290" y2="277" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="385" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#57606a">setup timed separately from the work</text><rect x="548" y="120" width="190" height="74" rx="6" fill="#f2fbf4" stroke="#116329" stroke-width="1.5"/><text x="643.0" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">do the answers match?</text><text x="643.0" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">counts exactly,</text><text x="643.0" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">sums to a relative</text><text x="643.0" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">tolerance</text><line x1="480" y1="91" x2="548" y2="157" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="153" x2="548" y2="157" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="215" x2="548" y2="157" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="277" x2="548" y2="157" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="548" y="232" width="190" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="643.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1b1f23">timings are read</text><text x="643.0" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">medians, with spread</text><line x1="643" y1="194" x2="643" y2="232" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><text x="700" y="218" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#116329">only if they match</text><rect x="790" y="120" width="146" height="74" rx="6" fill="#fff5f4" stroke="#b42318" stroke-width="1.5"/><text x="863.0" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">refuse</text><text x="863.0" y="158" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">exit 4: the engines</text><text x="863.0" y="172" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">computed different</text><text x="863.0" y="186" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">things</text><line x1="738" y1="157" x2="790" y2="157" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="790" y="232" width="146" height="56" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="863.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">a verdict</text><text x="863.0" y="270" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">exit 0, 1 or 5</text><line x1="738" y1="260" x2="790" y2="260" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><rect x="130" y="400" width="700" height="66" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="480.0" y="420" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1b1f23">a benchmark whose engines quietly disagree is worse than no benchmark</text><text x="480.0" y="438" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">it looks like evidence, so the comparison is gated on the answers before any timing is published</text><line x1="863" y1="194" x2="700" y2="400" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/><line x1="643" y1="288" x2="480" y2="400" stroke="#8c959f" stroke-width="1.5" marker-end="url(#a)"/></svg>
